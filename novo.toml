[package]
name        = "http-codec-nv"
version     = "0.1.0"
description = "HTTP/1.1 request and response as a state machine that performs nothing: feed it bytes and take a head, then body chunks, then an end.  Content-Length and chunked framing, a header list with case-insensitive lookup that keeps the case it arrived in, refusals that name the byte offset, and encoders that return bytes."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: bytes in, events out, and no socket.  Nothing here connects,
# waits, retries or reads a clock.  The one function that takes a
# stream, `h1read.drain`, binds the effect parameter of the standard
# library's `Read[e]`, so it costs what the caller's source costs and
# the package declares no effect of its own (SPEC section 5.6).
layer       = "core"

category    = "networking"

tags        = ["http", "http1", "rfc9110", "rfc9112", "codec", "parser", "chunked", "sans-io", "state-machine"]
repository  = "https://github.com/novolang/http-codec-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

[docs.pages]
"README.md" = "HTTP/1.1, without a socket"

[dependencies]
# None.  A request target is carried as the `Str` it arrived as, with
# `h1msg.target_form` saying which of the four forms of RFC 9112
# section 3.2 it has.  Only the absolute form is a URL, and a caller
# that wants it parsed hands the `Str` to url-nv.
